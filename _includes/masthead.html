{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main navigation">
        <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="navigation-overflow"><i class="fa-solid fa-bars nav-menu-icon" aria-hidden="true"></i><i class="fa-solid fa-xmark nav-close-icon" aria-hidden="true"></i></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item persist tail">
            <button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i></button>
          </li>
        </ul>
        <ul id="navigation-overflow" class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
