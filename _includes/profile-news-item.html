<li>
  {% assign event_date = include.item.date %}
  {% if event_date.size == 7 %}{% assign event_date = event_date | append: '-01' %}{% endif %}
  <time datetime="{{ include.item.date | escape }}">[{{ event_date | date: '%b %Y' }}]</time>
  <div class="profile-news__text">{{ include.item.text | markdownify }}</div>
</li>
